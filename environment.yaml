name: areskg
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      # ------------------------------------------------------------------
      # Common / shared dependencies (used by both the LLM data-extraction
      # pipeline and the downstream GNN resistance-prediction pipeline)
      # NOTE: original environment.yaml pinned numpy==1.21.6 / pandas==1.3.5 /
      # matplotlib==3.5.3 under python=3.7. These are bumped to satisfy
      # script/requirements.txt's floors (numpy>=1.24.0, pandas>=1.5.0,
      # matplotlib>=3.7.0), which in turn required bumping python to 3.9,
      # and scipy/scikit-learn to versions compatible with numpy>=1.24.
      # ------------------------------------------------------------------
      - numpy>=1.24.0
      - pandas>=1.5.0
      - matplotlib>=3.7.0
      - requests>=2.28.0
      - tqdm==4.67.1
      - scipy>=1.10.0
      - scikit-learn>=1.3.0

      # ------------------------------------------------------------------
      # Downstream: GNN / Resistance Prediction (kept pinned from the
      # original environment.yaml for reproducibility)
      # ------------------------------------------------------------------
      - torch==1.13.1
      - torch-cluster==1.6.1
      - torch-geometric==2.3.1
      - torch-scatter==2.1.1
      - torch-sparse==0.6.17
      - torch-spline-conv==1.2.2
      - nvidia-cublas-cu11==11.10.3.66
      - nvidia-cuda-nvrtc-cu11==11.7.99
      - nvidia-cuda-runtime-cu11==11.7.99
      - nvidia-cudnn-cu11==8.5.0.96
      - joblib==1.3.2
      - threadpoolctl==3.1.0
      - psutil==7.1.2
      - pillow==9.5.0
      - cycler==0.11.0
      - fonttools==4.38.0
      - kiwisolver==1.4.5
      - pyparsing==3.1.4
      - python-dateutil==2.9.0.post0
      - pytz==2025.2
      - six==1.17.0
      - packaging==24.0
      - charset-normalizer==3.4.4
      - idna==3.10
      - urllib3==2.0.7
      - jinja2==3.1.6
      - markupsafe==2.1.5
      - typing-extensions==4.7.1

      # ------------------------------------------------------------------
      # Upstream: LLM Data-Extraction Pipeline (from script/requirements.txt)
      # ------------------------------------------------------------------
      # Step 1: Paper Retrieval
      - pygetpapers>=1.2.0

      # Step 2: PDF Processing
      - PyMuPDF>=1.24.0
      - pymupdf4llm>=0.0.15
      - python-docx>=1.0.0
      - openpyxl>=3.1.0
      - tabulate>=0.9.0

      # Step 5: Data Post-processing
      - chembl-webresource-client>=0.10.0    # Optional: for SMILES lookup

      # Visualization (Optional)
      - seaborn>=0.12.0
      - networkx>=3.0
      - pyvis>=0.3.0
      - plotly>=5.0.0

      # Utilities
      - beautifulsoup4>=4.12.0
      - tiktoken>=0.5.0
